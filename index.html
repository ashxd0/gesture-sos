<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Monitor - Final</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <style>
        body { font-family: sans-serif; background: #0b0b0b; color: #fff; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 10px; }
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 10px; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #start-btn { padding: 20px 40px; font-size: 1.3rem; font-weight: bold; border-radius: 50px; border: none; background: #2e7d32; color: white; cursor: pointer; }
        .video-box { border-radius: 12px; overflow: hidden; border: 2px solid #333; position: relative; aspect-ratio: 4/3; background: #000; }
        video { display: none; } /* Raw video is processed in background */
        canvas { width: 100%; height: 100%; transform: scaleX(-1); } /* Mirror preview */
        #status-box { width: 100%; padding: 20px 0; border-radius: 12px; background: #1b5e20; text-align: center; font-size: 1.6rem; font-weight: bold; }
        .red-alert { background: #b71c1c !important; box-shadow: 0 0 40px #ff0000; }
        #countdown-container { height: 30px; text-align: center; color: #ffca28; font-weight: bold; margin-top: 5px; }
        #log-container { background: #141414; border: 1px solid #333; border-radius: 12px; padding: 15px; height: 100px; overflow-y: auto; font-family: monospace; font-size: 0.8rem; color: #888; }
    </style>
</head>
<body>

    <div id="overlay">
        <button id="start-btn">START SYSTEM</button>
        <p style="color: #666; margin-top: 15px;">Click to Enable Camera & Notifications</p>
    </div>

    <div class="container">
        <div class="video-box">
            <video id="webcam"></video>
            <canvas id="output-canvas"></canvas>
        </div>
        <div id="status-box">SYSTEM READY</div>
        <div id="countdown-container"></div>
        <div id="log-container"></div>
    </div>

    <script>
        // CONFIG - ENTER YOUR DETAILS
        const TELEGRAM_TOKEN = '8354493610:AAE7HuJRG6nUl7Uv1gLXC5J4LZympYZLleY'; 
        const TELEGRAM_CHAT_ID = '8057014714';

        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusBox = document.getElementById('status-box');
        const countdownDisplay = document.getElementById('countdown-container');
        const logContainer = document.getElementById('log-container');
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');

        let audioCtx = null;
        let firstIncidentTime = 0;
        let isCooldown = false;
        let timerInterval = null;

        function addLog(msg) {
            const div = document.createElement('div');
            div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logContainer.prepend(div);
        }

        async function sendTelegramAlert() {
            const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodeURIComponent("🚨 EMERGENCY ALERT: Signal detected on laptop.")}`;
            try { await fetch(url); addLog("Telegram Sent."); } catch (e) { addLog("Telegram Fail."); }
        }

        function triggerSynthAlarm() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 5);
        }

        function isDistressSignal(lm) {
            const getDist = (p1, p2) => Math.sqrt((p1.x-p2.x)**2 + (p1.y-p2.y)**2);
            const wrist = lm[0];
            const thumbTucked = getDist(lm[4], lm[17]) < getDist(lm[4], lm[5]);
            const f1 = getDist(lm[8], wrist) < getDist(lm[5], wrist);
            const f2 = getDist(lm[12], wrist) < getDist(lm[9], wrist);
            const f3 = getDist(lm[16], wrist) < getDist(lm[13], wrist);
            const f4 = getDist(lm[20], wrist) < getDist(lm[17], wrist);
            return thumbTucked && f1 && f2 && f3 && f4;
        }

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                for (const landmarks of results.multiHandLandmarks) {
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 3});
                    if (isDistressSignal(landmarks)) handleDetection();
                }
            }
            canvasCtx.restore();
        }

        function handleDetection() {
            if (isCooldown) return;
            const now = Date.now();
            statusBox.classList.add('red-alert');
            statusBox.innerText = "SIGNAL DETECTED";

            if (firstIncidentTime > 0 && (now - firstIncidentTime) < 15000) {
                addLog("ALARM TRIGGERED!");
                triggerSynthAlarm();
                sendTelegramAlert();
                clearInterval(timerInterval);
                countdownDisplay.innerText = "!!! ALARM !!!";
                isCooldown = true;
                setTimeout(resetSystem, 5000);
            } else {
                addLog("1st Signal Caught.");
                firstIncidentTime = now;
                startCountdown(15);
                isCooldown = true;
                setTimeout(() => isCooldown = false, 2500);
            }
        }

        function startCountdown(sec) {
            let left = sec;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                left--;
                countdownDisplay.innerText = `ALARM WINDOW: ${left}s`;
                if (left <= 0) resetSystem();
            }, 1000);
        }

        function resetSystem() {
            clearInterval(timerInterval);
            firstIncidentTime = 0;
            isCooldown = false;
            countdownDisplay.innerText = "";
            statusBox.classList.remove('red-alert');
            statusBox.innerText = "SYSTEM READY";
        }

        const hands = new Hands({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
        hands.setOptions({maxNumHands: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5});
        hands.onResults(onResults);

        startBtn.addEventListener('click', () => {
            overlay.style.display = 'none';
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const camera = new Camera(videoElement, {
                onFrame: async () => { 
                    canvasElement.width = videoElement.videoWidth;
                    canvasElement.height = videoElement.videoHeight;
                    await hands.send({image: videoElement}); 
                },
                width: 640, height: 480
            });
            camera.start();
            addLog("System Online.");
        });
    </script>
</body>
</html>
